<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Untitled</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f2efe8;--ink:#242720;--card:#fffdf7;--line:#d9d6cc;--accent:#e76f51}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.top{padding:20px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand{font-weight:900;letter-spacing:-1px;font-size:20px}
#clock{font:12px monospace}
main{max-width:1050px;width:90%;margin:50px auto}
.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:35px}
h1{font-size:clamp(42px,8vw,82px);letter-spacing:-5px;line-height:.95;margin:15px 0}
h1 span{color:var(--accent)}
.muted{color:#77786f;line-height:1.7}
.eyebrow{font:11px monospace;letter-spacing:3px;text-transform:uppercase}
#newBtn{background:var(--ink);color:white;border:0;padding:14px 20px;border-radius:5px}
#newBtn:hover{background:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar button{padding:10px 15px;background:transparent;border:1px solid var(--line);border-radius:30px}
.toolbar button.active{background:var(--ink);color:white;border-color:var(--ink)}
#search{width:100%;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:25px;outline-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.visual{height:170px;display:grid;place-items:center;position:relative;overflow:hidden}
.visual span{font-size:68px;transition:transform .3s}
.card:hover .visual span{transform:rotate(-10deg) scale(1.12)}
.cardBody{padding:18px}
.card h2{font-size:17px;margin:0 0 8px}
.card p{font-size:13px;line-height:1.7;color:#77786f;margin:0 0 16px}
.cardFoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:10px monospace;text-transform:uppercase;letter-spacing:1px}
.save{border:1px solid var(--line);background:transparent;border-radius:5px;padding:8px 10px}
.save:hover,.save.saved{background:var(--accent);color:white;border-color:var(--accent)}
#empty{text-align:center;padding:60px 10px;display:none}
footer{text-align:center;padding:45px 10px;color:#85857b;font:11px monospace}
#modal{display:none;position:fixed;inset:0;background:#171913b8;z-index:5;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
.dialog{background:var(--card);width:min(480px,100%);padding:28px;border-radius:10px;position:relative}
.dialog h2{font-size:30px;letter-spacing:-1px}
#close{position:absolute;right:15px;top:15px;border:0;background:transparent;font-size:24px}
#bigIcon{font-size:70px}
#surprise{border:1px solid var(--line);padding:15px;margin-top:15px;line-height:1.8;display:none;white-space:pre-wrap}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.grid{grid-template-columns:1fr}main{margin:30px auto}h1{letter-spacing:-3px}.visual{height:190px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">little things<span style="color:var(--accent)">.</span></div>
  <div id="clock">LOADING...</div>
</header>

<main>
  <section class="hero">
    <div>
      <div class="eyebrow">A COLLECTION OF UNUSUAL THINGS</div>
      <h1>Small things.<br><span>Big feelings.</span></h1>
      <p class="muted">A tiny corner of the internet for things worth discovering.</p>
    </div>
    <button id="newBtn">Find me something →</button>
  </section>

  <div class="toolbar" id="filters">
    <button class="active" data-filter="all">Everything</button>
    <button data-filter="odd">Oddities</button>
    <button data-filter="cozy">Cozy</button>
    <button data-filter="creative">Creative</button>
    <button data-filter="saved">Saved</button>
  </div>

  <input id="search" placeholder="Search the collection..." autocomplete="off">

  <section class="grid" id="grid"></section>
  <div id="empty">
    <h2>Nothing here... yet.</h2>
    <p class="muted">Try another search or category.</p>
  </div>
</main>

<footer>MADE OF CURIOSITY · UPDATED EVERY TIME YOU VISIT</footer>

<div id="modal">
  <div class="dialog">
    <button id="close" aria-label="Close">×</button>
    <div id="bigIcon"></div>
    <div class="eyebrow" id="detailTag"></div>
    <h2 id="detailTitle"></h2>
    <p class="muted" id="detailDescription"></p>
    <button id="newBtn2">Show me another →</button>
    <div id="surprise"></div>
  </div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const items = [
 {id:"01",title:"A cloud with a job",icon:"☁️",tag:"odd",color:"#dbe8ed",description:"It has been assigned to float above one specific house. It takes its job extremely seriously.",extra:"EMPLOYEE RECORD\nPosition: Cloud\nDepartment: Weather\nPerformance: Mostly cloudy\nDays off: Never"},
 {id:"02",title:"Rainy afternoon",icon:"🌧️",tag:"cozy",color:"#d6e0ef",description:"A window, a blanket, and the sound of rain tapping on the roof. Absolutely nowhere else to be.",extra:"CURRENT CONDITIONS\nRain: Gentle\nTea: Optional\nObligations: Postponed\nMood: Excellent"},
 {id:"03",title:"The tiny museum",icon:"🏛️",tag:"creative",color:"#f3d8bc",description:"An imaginary museum containing objects that nobody else would think to keep.",extra:"TODAY'S EXHIBITION\nOne interesting pebble.\nA receipt from 2009.\nA button with no shirt.\nA drawing made during math class."},
 {id:"04",title:"Extremely suspicious frog",icon:"🐸",tag:"odd",color:"#d9e9c4",description:"This frog knows something about the moon. It will not elaborate.",extra:"INTERROGATION NOTES\nQuestion: What do you know?\nAnswer: Ribbit.\nQuestion: About the moon?\nAnswer: ...ribbit.\nCase status: UNRESOLVED"},
 {id:"05",title:"The blanket fort",icon:"⛺",tag:"cozy",color:"#ead8e9",description:"A highly advanced architectural structure made entirely of blankets and questionable engineering.",extra:"BUILDING SPECIFICATIONS\nWalls: 4 blankets\nRoof: 1 bedsheet\nLighting: Fairy lights\nStructural integrity: Depends on the cat"},
 {id:"06",title:"Pocket-sized universe",icon:"🌌",tag:"odd",color:"#d9d6f3",description:"A universe so small that its stars look like glitter. Its inhabitants have no idea they're tiny.",extra:"COSMIC REPORT\nStars: Too many to count\nGalaxies: 3\nBlack holes: 0\nPopulation: Approximately everyone"},
 {id:"07",title:"A very good pencil",icon:"✏️",tag:"creative",color:"#f3e1a9",description:"It draws exactly what you imagine. Unfortunately, it only works on Tuesdays.",extra:"USER MANUAL\n1. Hold pencil.\n2. Imagine something.\n3. Draw it.\n4. Wait until Tuesday if it refuses.\n5. Do not sharpen the magic away."},
 {id:"08",title:"Sleepy orange cat",icon:"🐈",tag:"cozy",color:"#f4d4b3",description:"A cat that has mastered the ancient art of doing absolutely nothing for six consecutive hours.",extra:"DAILY SCHEDULE\n12:00 — Nap\n13:00 — Longer nap\n14:00 — Consider food\n14:01 — Nap\nTomorrow — Repeat"},
 {id:"09",title:"The wrong door",icon:"🚪",tag:"odd",color:"#ead4c8",description:"Every time you open it, you find a completely different room. Nobody remembers installing it.",extra:"DOOR LOG\nAttempt 1: A library.\nAttempt 2: A swimming pool.\nAttempt 3: A room full of smaller doors.\nAttempt 4: The same room, but everything is upside down."},
 {id:"10",title:"Color collector",icon:"🎨",tag:"creative",color:"#f4c9cc",description:"Someone who collects colors that do not have names yet. Their collection is growing rapidly.",extra:"LATEST DISCOVERIES\nAlmost-sunset orange.\nThe blue of an old screen.\nThe green of a forgotten place.\nA color that only exists in dreams."},
 {id:"11",title:"Midnight kitchen",icon:"🍞",tag:"cozy",color:"#e8d7c0",description:"The kitchen at night, when the refrigerator hums and the floor feels colder than usual.",extra:"KITCHEN INVENTORY\nOne glass of water.\nThree mysterious crumbs.\nA suspicious refrigerator noise.\nSomeone's leftover cake."},
 {id:"12",title:"The button",icon:"🔴",tag:"odd",color:"#f0cece",description:"A red button with a handwritten note that says: please do not press. There is no other information.",extra:"BUTTON REPORT\nColor: Red\nTexture: Smooth\nInstructions: DO NOT PRESS\nPress count: Nobody is talking about that"},
 {id:"13",title:"Cloud-shaped island",icon:"🏝️",tag:"creative",color:"#cce5df",description:"A tiny floating island where the trees grow upside down and the ocean hangs in the sky.",extra:"TRAVEL GUIDE\nBest season: Whenever\nLocal transport: Floating\nNative wildlife: Probably friendly\nReturn tickets: Not required"},
 {id:"14",title:"A little ghost",icon:"👻",tag:"cozy",color:"#e0e0ed",description:"A ghost who is not very good at haunting. It mostly leaves encouraging notes around the house.",extra:"RECENT HAUNTINGS\nYou did a good job today.\nDrink some water.\nYour drawing is cool.\nI put the remote on the table."},
 {id:"15",title:"The forgotten arcade",icon:"🕹️",tag:"creative",color:"#d3d1ef",description:"An arcade where every machine contains a different little world. One of them is still running.",extra:"MACHINE STATUS\nPIXEL RUNNER: Online\nMOON JUMP: Offline\nFROG QUEST: Unknown\nMYSTERY GAME: INSERT COIN"}
];

let filter = "all";
let query = "";
let current = null;
let seen = new Set();

function getSaved(){
 try{return JSON.parse(localStorage.getItem("littleThingsSaved")||"[]")}
 catch{return []}
}

function setSaved(ids){
 try{localStorage.setItem("littleThingsSaved",JSON.stringify(ids))}
 catch{}
}

function render(){
 const saved = getSaved();

 const shown = items.filter(item => {
   const matchesFilter =
     filter === "all" ||
     item.tag === filter ||
     (filter === "saved" && saved.includes(item.id));

   const text = (item.title+" "+item.description+" "+item.tag).toLowerCase();
   return matchesFilter && text.includes(query);
 });

 $("grid").replaceChildren();
 $("empty").style.display = shown.length ? "none" : "block";

 shown.forEach(item => {
   const card = document.createElement("article");
   card.className = "card";

   const visual = document.createElement("div");
   visual.className = "visual";
   visual.style.background = item.color;

   const icon = document.createElement("span");
   icon.textContent = item.icon;
   visual.appendChild(icon);

   const body = document.createElement("div");
   body.className = "cardBody";

   const title = document.createElement("h2");
   title.textContent = item.title;

   const description = document.createElement("p");
   description.textContent = item.description;

   const foot = document.createElement("div");
   foot.className = "cardFoot";

   const tag = document.createElement("span");
   tag.className = "tag";
   tag.textContent = item.tag;

   const save = document.createElement("button");
   save.className = "save"+(saved.includes(item.id)?" saved":"");
   save.textContent = saved.includes(item.id)?"♥ Saved":"♡ Save";
   save.addEventListener("click",event=>{
     event.stopPropagation();
     const list = getSaved();
     const index = list.indexOf(item.id);
     if(index >= 0) list.splice(index,1);
     else list.push(item.id);
     setSaved(list);
     render();
   });

   foot.append(tag,save);
   body.append(title,description,foot);
   card.append(visual,body);

   card.tabIndex = 0;
   card.setAttribute("role","button");
   card.setAttribute("aria-label","Explore "+item.title);
   card.addEventListener("click",()=>openItem(item));
   card.addEventListener("keydown",event=>{
     if(event.key==="Enter"||event.key===" "){
       event.preventDefault();
       openItem(item);
     }
   });

   $("grid").appendChild(card);
 });
}

function openItem(item){
 current = item;
 seen.add(item.id);

 $("bigIcon").textContent = item.icon;
 $("detailTag").textContent = "COLLECTION / "+item.id;
 $("detailTitle").textContent = item.title;
 $("detailDescription").textContent = item.description;
 $("surprise").style.display = "none";
 $("surprise").textContent = "";
 $("modal").classList.add("open");
}

function randomItem(){
 let choices = items.filter(item=>!current || item.id!==current.id);
 if(!choices.length) choices=items;
 const item=choices[Math.floor(Math.random()*choices.length)];
 openItem(item);
}

$("newBtn").addEventListener("click",randomItem);
$("newBtn2").addEventListener("click",randomItem);
$("close").addEventListener("click",()=>$("modal").classList.remove("open"));

$("modal").addEventListener("click",event=>{
 if(event.target===$("modal")) $("modal").classList.remove("open");
});

document.addEventListener("keydown",event=>{
 if(event.key==="Escape") $("modal").classList.remove("open");
});

$("filters").querySelectorAll("button").forEach(button=>{
 button.addEventListener("click",()=>{
   filter=button.dataset.filter;
   $("filters").querySelectorAll("button").forEach(b=>{
     b.classList.toggle("active",b===button);
   });
   render();
 });
});

$("search").addEventListener("input",event=>{
 query=event.target.value.toLowerCase().trim();
 render();
});

function updateClock(){
 $("clock").textContent=new Date().toLocaleTimeString([],{
   hour:"2-digit",minute:"2-digit"
 });
}

updateClock();
setInterval(updateClock,1000);
render();

})();
</script>
</body>
</html>
